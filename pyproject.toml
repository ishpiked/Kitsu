[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anilist-telegram-bot"
version = "1.0.0"
description = "Production-quality Telegram bot for AniList integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot==22.0",
    "fastapi==0.115.0",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.29.0",
    "redis==5.2.0",
    "httpx==0.28.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.8.0",
    "python-dotenv==1.0.1",
    "structlog==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "mypy==1.13.0",
    "types-redis==4.6.0.20240903",
    "aiosqlite==0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.alembic]
script_location = "migrations"